<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>企鹅助理设置</title><style>body{font:14px system-ui;max-width:760px;margin:40px auto;padding:0 20px;line-height:1.7}code{background:#f4f4f5;padding:2px 5px;border-radius:5px}.box{border:1px solid #ddd;border-radius:14px;padding:18px;margin:18px 0}</style></head><body><h1>🐧 企鹅助理浏览器扩展</h1><div class="box"><h2>安全原则</h2><p>插件不会因为安装而自动授权浏览器。必须由你在当前标签页点击“仅查看”或“查看 + 操作”。跨站跳转会自动撤销授权。</p><p>发送、提交、付款、购买、删除、发布、转账等敏感点击默认要求再次“允许一次”。密码字段和文件上传默认禁止自动填写。</p></div><div class="box"><h2>Connector 桥</h2><p>正式接入时使用 Chrome Native Messaging Host：<code>com.qienet.penguin_assistant</code>。当前 0.1.0 已完成扩展端协议，Connector 端注册和路由将在 browser_bridge_v2 集成阶段完成。</p></div></body></html>
